<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — BookMyShow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="pageLoader"><div class="ld-logo">BookMyShow</div><div class="ld-bar"><div class="ld-fill"></div></div></div>
<div id="navMount"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:22px">
      <div class="auth-logo-text">BookMyShow</div>
      <div style="font-size:.74rem;color:var(--mt);margin-top:2px">India's Premium Movie Booking</div>
    </div>
    <h1 class="auth-h1">Welcome back 👋</h1>
    <p class="auth-sub">Sign in to book tickets & manage your watchlist</p>
    <form id="loginForm" novalidate>
      <div class="fg">
        <label class="fl" for="lEmail">EMAIL ADDRESS</label>
        <input type="email" id="lEmail" class="fi" placeholder="you@example.com" autocomplete="email">
        <div class="fe" id="lEE"></div>
      </div>
      <div class="fg">
        <label class="fl" for="lPass">PASSWORD</label>
        <div class="input-ico-wrap">
          <input type="password" id="lPass" class="fi" placeholder="Your password" autocomplete="current-password" style="padding-right:40px">
          <button type="button" class="input-ico" data-eye="lPass">👁️</button>
        </div>
        <div class="fe" id="lEP"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <label style="display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--mt);cursor:pointer">
          <input type="checkbox" id="lRemember" style="accent-color:var(--red)"> Remember me
        </label>
        <a href="#" style="font-size:.78rem;color:var(--red)">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-red btn-full btn-lg" style="margin-bottom:10px">Sign In</button>
      <button type="button" id="demoBtn" class="btn btn-glass btn-full">🎭 Try Demo Account</button>
    </form>
    <div class="auth-div">or sign in with</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px">
      <button class="btn btn-outline btn-sm" onclick="TOAST.show('Google login coming soon!','info')">🔵 Google</button>
      <button class="btn btn-outline btn-sm" onclick="TOAST.show('OTP login coming soon!','info')">📱 Phone OTP</button>
    </div>
    <div class="auth-footer">New to BookMyShow? <a href="signup.html">Create account</a></div>
    <div id="backendStatus" style="margin-top:14px;padding:8px 12px;border-radius:var(--rsm);font-size:.71rem;text-align:center;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:#ffa500">
      ⏳ Checking backend...
    </div>
  </div>
</div>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
mountNavbar('');
(async()=>{
  const el=document.getElementById('backendStatus');
  try {
    const r=await fetch('http://localhost:5000/api/health');
    const d=await r.json();
    if(d.status==='OK'){el.style.background='rgba(34,197,94,.08)';el.style.borderColor='rgba(34,197,94,.2)';el.style.color='var(--green)';el.textContent='✅ Backend connected — Login ready!';}
  } catch {
    el.style.background='rgba(229,9,20,.08)';el.style.borderColor='rgba(229,9,20,.2)';el.style.color='var(--red)';
    el.textContent='❌ Backend offline — Run: cd backend && npm start';
  }
})();
</script>
</body>
</html>
